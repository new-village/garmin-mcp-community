[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp-community"
version = "0.1.0"
description = "Unofficial, community-maintained MCP server for Garmin Connect"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0",
    "garminconnect>=0.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
garmin-mcp-community = "garmin_mcp_community.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp_community"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
